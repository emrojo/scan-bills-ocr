# ==============================================================================
# ScanBills OCR - CPU-Only Deployment (No NVIDIA GPU Required)
# Optimized for standard Cloud VPS (Hetzner, AWS, DigitalOcean, Linode) or local PC
# ==============================================================================

services:
  # Ollama VLM inference engine running on CPU (internal only, no host port exposed)
  ollama:
    image: ollama/ollama:latest
    container_name: scanbills-ollama-cpu
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    networks:
      - proxy-network
    restart: unless-stopped

  # Autonomous one-time model downloader for CPU
  model-puller:
    image: ollama/ollama:latest
    container_name: scanbills-model-puller-cpu
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    networks:
      - proxy-network
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama CPU service to become ready...';
        until ollama list > /dev/null 2>&1; do
          sleep 2;
        done;
        echo 'Ollama CPU is ready. Pulling lightweight VLM model: ${OLLAMA_MODEL:-qwen2.5vl:3b}...';
        ollama pull ${OLLAMA_MODEL:-qwen2.5vl:3b};
        echo 'Model pull complete. CPU service is fully autonomous.';
      "
    restart: "no"

  # ScanBills FastAPI Web Service & UI (bound to 127.0.0.1:8030)
  web:
    image: ghcr.io/emrojo/scan-bills-ocr:latest
    build: .
    container_name: scanbills-web-cpu
    ports:
      - "127.0.0.1:${PORT:-8030}:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5vl:3b}
      - TIMEOUT_SECONDS=360
    depends_on:
      - ollama
    networks:
      - proxy-network
    restart: unless-stopped

networks:
  proxy-network:
    external: true

volumes:
  ollama_data:
    name: scanbills_ollama_data
